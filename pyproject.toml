[project]
name = "mlx-lingbot-map"
version = "0.1.0"
description = "Native Apple Silicon (Metal) Streaming 3D Reconstruction Pipeline powered by MLX"
readme = "README.md"
requires-python = ">= 3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mlx",
    "Pillow",
    "opencv-python",
    "numpy",
    "scipy",
    "tqdm",
    "safetensors",
    "viser",
    "trimesh",
    "matplotlib"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lingbot_map_mlx*"]
